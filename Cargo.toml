[package]
name = "passkeys"
version = "0.1.0"
edition = "2024"

description = "Experimental library for using MPC with passkeys"
repository = "https://github.com/louib/passkeys"
license = "MIT"

readme = "README.md"

include = [
  "src/",
  "README.md",
  "LICENSE",
]

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net"], optional = true, default-features = false }
ciborium = { version = "0.2", default-features = false, optional = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = { version = "0.10", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
log = { version = "0.4", default-features = false }
async-trait = { version = "0.1", default-features = false }
env_logger = { version = "0.10", optional = true }
frost-ed25519 = { version = "3.0", default-features = false }

[features]
default = []
linux-uhid = ["dep:ciborium", "dep:env_logger", "dep:tokio"]

[[example]]
name = "uhid_local"
path = "examples/uhid_local.rs"
required-features = ["linux-uhid"]

[[example]]
name = "uhid_frost"
path = "examples/uhid_frost.rs"
required-features = ["linux-uhid"]
